    <!-- Registration Landing Page -->
    <section class="vh-100 d-flex align-items-center" style="padding-top: 80px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card shadow p-4">
                        <h2 class="card-title text-center mb-4">Daftar Komunitas</h2>
                        <form>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Masukkan nama lengkap" required />
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Alamat Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Masukkan email" required />
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Nomor Telepon</label>
                                <input type="tel" class="form-control" id="phone" placeholder="Masukkan nomor telepon" />
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Kata Sandi</label>
                                <input type="password" class="form-control" id="password" placeholder="Masukkan kata sandi" required />
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Konfirmasi Kata Sandi</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Konfirmasi kata sandi" required />
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Daftar Sekarang</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
